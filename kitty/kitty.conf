# Fonts
#
font_family JetBrainsMono Nerd Font Mono
font_size 13

modify_font cell_height 103%
modify_font cell_width 100%

# Window
#
window_padding_width 0 15 15 15
tab_bar_margin_width 10
tab_bar_style powerline
enable_audio_bell no
placement_strategy center

#: OS specific tweaks
#
macos_titlebar_color system
macos_hide_titlebar no
macos_hide_from_tasks no
macos_quit_when_last_window_closed no
macos_window_resizable yes
macos_thicken_font 0
macos_show_window_title_in none

# Keybindings
#
macos_option_as_alt right

# Ctrl and click to open a link
mouse_map ctrl+left press ungrabbed,grabbed mouse_click_url

# Mouse
mouse_hide_wait -1

# Theme
# nord is the default; theme_switcher.sh writes themes/active.conf (untracked)
# to override it, so switching never edits a tracked file.
include ./themes/nord.conf
include ./themes/active.conf

# Claude Code draws in 256-colour mode under tmux, which shifts Nord's tinted
# greys to purple, so exact colours come from remapped palette entries:
# 153: inline code (Claude's custom themes can't change it), Nord yellow.
color153 #ebcb8b
# 17: prompt background, set as ansi256(17) in the readable-transcript
# repo's Claude theme, themes/nord-kitty.json. Nord grey13, lighter than the
# pane so your messages stand out.
color17 #333a47
# 18: your messages' text, set as "text": ansi256(18) in that theme. Nord
# grey7, dimmer than Claude's replies.
color18 #929cb0
# 19-21 and 27-31: the readable-transcript mod's colours, set as its options
# (pluginConfigs) in claude/settings.json.
# Not 22: Claude Code draws the background of added diff lines with it.
# 19 reply bar, Kitty's bright magenta
color19 #c895bf
# 20 your messages' border, Nord cyan
color20 #88c0d0
# 21 tool lines, Nord grey10
color21 #616d85
# 23-26: edit diffs, set as diffAdded and the rest in that theme.
# GitHub's dark diff tints (#2ea043 and #f85149, 15% for a line and 40% for
# the words changed in it) over the background: dark, so code stays readable.
# 23 added line
color23 #2e4440
# 24 removed line
color24 #4c3841
# 25 added words
color25 #2e5f41
# 26 removed words
color26 #7f4044
# 27: the readable-transcript mod's spinner frame and tool line, Nord yellow.
color27 #ebcb8b
# 28-29: the readable-transcript mod's line on a background task's notice.
# 28 finished, Nord green
color28 #a3be8c
# 29 failed or stopped, Nord red. Failed tool rows use it too.
color29 #bf616a
# 30: the tint behind tool calls and Bash output, 3% of Nord yellow over the
# background: as faint a lift as color17 behind your messages.
color30 #343942
# 31: the tint behind the line left when a turn ends ("Worked for 12s"), 3%
# of Nord green over the background. Its frame uses 28.
color31 #323842
